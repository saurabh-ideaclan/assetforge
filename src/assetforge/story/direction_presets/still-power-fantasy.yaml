art_style: manhwa-fantasy
art_note: 'a sixty-floor academy tower seen from inside: stairwells, lift shafts, the tall brass Gauge with its rising white
  light, an atrium open to every floor above; Floor Zero is boilers, pipes, steam and warm amber lamps, the upper floors
  are glass, pale stone and daylight; polished manhwa line work; brass and slate palette with one accent per scene, the
  pale ring of a Still where dust and sparks hang motionless in the air. Every place is tall and is drawn for an upright
  phone screen.'
custom:
  requirements: 'Emotion on the page in concrete physical detail (hands, breath, what is not said), never named abstractly.
    Every chapter shows the tower as a ladder: which floor we are on, who may ride the lift and who takes the stairs. Every
    chapter but one has a clock: a bout, an inspection, the lift doors, the Sweep at the end of term. One chapter is the breath:
    an evening in the Long Ward and the boiler level, no bout, the cost of hiding counted in small things. Noah''s gift is
    never described as a number; its cost is always shown on his body. The sister is present through the ward visit, her
    things and his habits, never through flashback speeches. Higher floors address Floor Zero cadets as "Zero"; Noah and the
    boiler level use names. The whole story happens inside the Spire across one term; it does not leave the city.'
  exclusions: No letter ranks, no system windows, no stat screens, no levels or numbers above sixty, no chosen-one prophecy.
    No cults, demons, angels, apocalypse, serial killers or travel abroad. The gift is never a killing instinct or bloodlust,
    and the protagonist's past is not abuse by guardians. Power is not a loan, a debt or something carried aboard (those
    are other stories). No one is revealed as secretly royal. No Korean, Japanese or Chinese names.
  canon: 'EMOTIONAL SPINE: Noah Reed, 20, is ashamed and patient and shows neither. Six years ago a tram bridge in Calder
    came down in a Surge. Noah, fourteen, stopped the falling span and everything under it. When he let go, everything started
    again except his sister. Mia Reed, nine, has been held ever since: mid-step, one hand out, her school bag strap slipping
    off her shoulder, eyes open, not older by a day. She lies in the Long Ward on Floor 31 of the Spire, listed as "long
    stillness, cause unknown"; the bed is free only while a family member serves as a cadet. So Noah enrolled, the Gauge read
    nothing, and he has lived on Floor Zero for two years, stoking boilers and holding pads for higher floors to hit ("hold
    still, Zero"). He visits her every evening after shift, tells her the day, and fixes the strap that never falls. What
    Noah wants, under everything, is to start her again, and to be the one who undoes what he did. Two things stand in the
    way: Floor Zero cadets who have not risen by the end of term are cut in the Sweep, and Mia loses her bed; and a cadet
    seen stopping anything is not ranked, he is reported, and Mia becomes evidence. The first chapter opens with the humiliation
    of pad duty on a high floor, builds dread through the first Sweep notice, and ends with Noah stopping something in front
    of one person who notices, because he could not watch it land.

    THE RULE: Noah can stop anything he can see. Starting it again is the part nobody taught him. A Still is banned in
    Calder: thirty years ago a Still stopped a whole market district for eleven days (the Held Days), and when the hold was
    broken some people never started again. Since then Stills are not trained, they are reported, and taken to the Quiet
    Ward. The truth, held in the sealed records of the Crown (the top floor, open only to Floor 50 and above), is that the
    Still of the Held Days was holding back a Surge that would have killed the district, and that the Guard broke her hold
    by force, which is why some never restarted. A hold released the right way needs two people: the Still, and someone
    moving inside the hold with them.

    ENVIRONMENT: The Spire is a sixty-floor academy tower at the centre of the city of Calder, where the Guard is trained
    to contain Surges (gifts running wild when too much Output fires in one place). In the Gauge Hall on the ground floor
    stands the Gauge, a brass column sixty floors tall with a white light inside: a cadet lays a hand on the plate, the
    light climbs, and where it stops is the floor they live, eat and train on. Lifts open only for your floor and below;
    Floor Zero takes the stairs. Floor Zero is the boiler level under the hall: pipes, steam, coal dust, amber lamps,
    bunks between the tanks, the drill square chalked on a concrete floor. The middle floors are drill halls and
    barracks; the Long Ward on Floor 31 is a quiet hall of tall windows and narrow beds; the Crown at the top is glass,
    daylight and the sealed archive. The term ends with the Sweep: every cadet lays a hand on the Gauge before the whole
    tower, and Floor Zero cadets whose light has not risen are cut.

    CAST DIRECTION (archetypes, not a script): a higher-floor duelist whose gift is speed, the first to notice a blade that
    arrived late, who comes down the stairs to find out instead of reporting it, and whose own gift is wearing her body
    out; Floor Zero''s drill instructor, a Guard veteran whose light never passed Floor 6 and who was held for eleven days
    as a boy, who teaches that the Gauge measures what you put out, not what you hold; a low-floor cadet who uses Floor Zero
    as targets because his own light is dropping; the first cadet of the Spire, admired and sincere, who believes in the
    Gauge completely; the Director, who gave the order that ended the Held Days. Adults and cadets only: every cadet is
    eighteen or older.'
