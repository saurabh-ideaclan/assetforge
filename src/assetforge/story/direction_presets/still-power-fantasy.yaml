naming: custom
naming_note: 'Plain, short, international names a reader anywhere can say on sight. Given names like Noah, Mia, Iris, Sam,
  Max, Ava, Leo, Nina, Ben, Lena; family names of one or two syllables like Reed, Vale, Cole, Hart, Lane, Doyle, Crane. No
  Korean, Japanese or Chinese names, no invented fantasy names, no apostrophes, no unusual spellings, no titles of nobility.
  Places have plain descriptive names: the Spire, Floor Zero, the Gauge Hall, the Long Ward, the Crown.'
