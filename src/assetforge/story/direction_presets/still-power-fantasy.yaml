name: still-power-fantasy
title: Academy Hidden Power (the tower where rank is a floor)
summary: 'A sixty-floor academy tower where a cadet lives on the floor the Gauge gives him. The cadet on Floor Zero can stop
  anything he can see, a gift the Gauge cannot read and the city has banned; he hides it to keep his sister, held still
  since she was nine, in the tower''s ward. Original world: no letter ranks, no system windows.'
