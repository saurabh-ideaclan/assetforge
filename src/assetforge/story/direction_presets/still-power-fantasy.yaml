- the Spire
name_overrides:
  protagonist: Noah Reed
world:
  progression: 'Every gift in Calder is Output: something a person puts out (heat, pressure, speed, light, sound). The Gauge
    measures Output and gives each cadet a floor, 1 to 60. Noah''s gift is the opposite, a Still: he can stop anything he
    can see, and the Gauge needle does not move for him, so he is Floor Zero. He rises without ever looking strong: small
    stills nobody notices (a foot that does not lift, a blade that arrives late), then holds that save people, then a hold
    he cannot hide. His limits are fixed and physical: he stops only what he can see; the stillness leaks into him (pulse
    slows, a hand goes cold and will not move for hours); and when he lets go, motion returns all at once, so he must move
    people out of the way first. Stopping he can do alone. Starting something again, he learns, takes a second person
    moving beside him.'
