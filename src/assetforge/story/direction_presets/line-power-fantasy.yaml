world:
  progression: 'Power (Charge) comes from the Hollows, night stations in the dust that the Line halts at; whatever a licensed
    Walker carries aboard before the whistle is theirs by Line law, and a coupler owns nothing he carries. Rafe''s rule is
    the reverse: whatever he carries aboard before the whistle stays with him, first a cut car and its people, then relics
    from the stations, then the Charge of a dying Walker he refused to leave, and in time a station itself. Every crossing
    makes him stronger and more of a criminal, because his power is theft by definition.'
