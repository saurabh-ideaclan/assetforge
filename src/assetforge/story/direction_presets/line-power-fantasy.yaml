title: Modern Awakening Power Fantasy (the train that never stops)
summary: 'A two-mile train crossing a dead continent, its poor cut loose on the grades; the coupler who re-links a cut car
  finds that whatever he carries aboard stays with him. Original world: no gates, no letter ranks, no system windows.'
