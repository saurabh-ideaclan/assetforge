art_note: 'a two-mile train at speed across dust: rust, chains and lamp oil in the Tail, brass and glass in the Engine Cars,
  roofs under a huge sky, night stations lit cold blue; polished manhwa line work; muted dust palette with one cold blue accent
  per scene (Charge)'
custom:
  requirements: 'Emotion on the page in concrete physical detail (hands, breath, what is not said), never named abstractly.
    Every chapter but one has the whistle or a grade as a deadline; the seventh (the shared grain, the spare sleeping loop)
    is the breath: flat ground, no whistle, the cost of the rescues counted in food and hands. Couplers and tail riders are
    addressed by number by anyone from the Engine Cars; Rafe uses names. The mother is present through objects and habits
    (the ticket, the counting, her knots on his hook), never through flashback speeches. Every chapter shows the train moving.'
  exclusions: No letter ranks, no system windows, no stat screens, no chosen-one prophecy, no zombies or horror monsters.
    Power is not a loan or a debt (that is another story). The train never stops in the first half; stopping it is the end-game
    question.
  canon: 'EMOTIONAL SPINE: Rafe is grieving and furious and shows neither. Three years ago, from the roof of car 212, he watched
    the Conductors cut his mother''s car loose on the Cinder Grade to make the climb; the manifest for that day lists the
    car as ''ballast, 31 t''. He keeps her punched ticket in his glove. He still counts the cars behind him every dawn the
    way she taught him. What Rafe wants, under everything, is her name on the Roll of the Line, the brass list of the dead
    in the Engine Cars, where the cut have never been written. His power is literally refusing to let go of what he is holding,
    and the story asks what that costs the people who hold on to him. The first chapter opens with the humiliation of the
    morning count (couplers called by hook number, Rafe is Hook Nine), builds dread as the Line approaches a grade, and ends
    with Rafe climbing down between cars to re-link a cut car with a stranger inside, because nobody climbed down for his
    mother.

    ENVIRONMENT: Meridian is a two-mile train that has crossed a dead continent for ninety years and must never stop; the
    whistle is the clock of every chapter (one blast: a halt at a station; two: the grade; three: cutting). The Engine Cars
    ride in warm light, brass and glass; the Tail rides in dust, rust, lamp oil, cold, with hammocks between crates and the
    wind through the roof hatches. Between them the Couplings: the roofs couplers walk at speed, the chains, the ladders,
    the gap where the ground blurs. The Hollows are night stations that appear in the dust where no station should be: a lit
    platform, a stopped clock, doors that open on more than a building should hold; Walkers go out at the halt and must be
    back aboard before the whistle, or the Line leaves them. Charge, what they bring back, is the cold blue light the Engine
    burns. By Line law whatever a licensed Walker carries aboard is theirs; a coupler owns nothing he carries.'
