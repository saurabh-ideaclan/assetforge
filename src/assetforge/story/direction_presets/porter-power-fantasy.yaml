name: porter-power-fantasy
title: Modern Awakening Power Fantasy (the one who carries)
summary: A coastal city fed by rifts that open at dawn and seal at dusk; the unranked porter who carries everything and owns nothing finds that whatever he carries across the seal stays with him. Original world, no gates, no letter ranks, no hunter licences.
region: global
readers: young-adult
writing_style: simple
genre: power-fantasy
subgenres: [awakening-hunter, weak-to-strong, second-awakening, action, conspiracy, found-family]
tradition: korean-webnovel
themes: [invisibility, humiliation, loyalty, social injustice, ownership, determination, hidden potential, transformation, recognition, power, debt to the ones who carried you]
world_type: modern-fantasy
culture: original
naming: invented
world:
  progression: Power comes out of the Hollows, rifts under the city that open at dawn and seal at dusk. By Guild law whatever a ranked Delver carries out is theirs and a porter owns nothing he carries. The protagonist's rule is the reverse of the law. Whatever he carries across the seal stays with him, first gear, then relics, then the strength of a dying Delver he refused to leave, and in time a Hollow itself. Every crossing makes him stronger and more of a criminal, because his power is theft by definition. Strength is always a choice against the people who could be blamed for it.
pacing: fast
tone: [tense, heroic, warm]
drama: high
romance: low
mystery: high
progression: gradual
depth: strong
choices: meaningful
cliffhangers: strong
art_style: manhwa-fantasy
art_note: coastal city of stacked concrete and cranes, dawn and dusk light, polished manhwa line work, muted palette with one cold blue accent per scene (the Hollow light)
