summary: Clean flat vector illustration
best_for: [icon, ui, object, background]
description: Geometric flat vector art like modern app illustration; crisp edges, solid fills
mood: clean and modern
lighting: none or a single flat shadow shape
shapes: geometric primitives, consistent corner radii, simplified forms
outline: no outlines, or uniform thin strokes
shading: flat colour fills with at most one darker tone for depth
texture: none
detail: low
composition: centered, generous negative space
avoid: [gradients, painterly brushwork, photo textures, noise]
