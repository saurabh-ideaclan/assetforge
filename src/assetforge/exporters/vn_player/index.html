<!doctype html>
<!-- assetforge-vn-player: generated by `assetforge story export` (safe to regenerate) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Novel</title>
<style>
  :root {
    --ink: #f4efe6; --ink-dim: #b9b2a6; --panel: rgba(16, 14, 22, 0.78); --panel-edge: rgba(255, 255, 255, 0.14);
    --accent: #e8b65a; --accent-ink: #1b1408; --shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    --font: "Georgia", "Iowan Old Style", "Times New Roman", serif; --ui: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #07060a; color: var(--ink); font-family: var(--font); overflow: hidden; }
  body { display: grid; place-items: center; }
  #stage { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; overflow: hidden; background: #111;
           container-type: inline-size; user-select: none; cursor: pointer; }
  .layer { position: absolute; inset: 0; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 700ms ease; }
  .bg.on { opacity: 1; }
  .placeholder-bg { display: grid; place-items: center; font: 600 3cqw var(--ui); color: rgba(255,255,255,.55); letter-spacing: .08em; }
  .t-day { background: linear-gradient(180deg, #8fc3e8, #e9dcc0); }
  .t-evening { background: linear-gradient(180deg, #3b2a5a, #e0855a 70%, #f2c27b); }
  .t-night { background: linear-gradient(180deg, #05070f, #1b2547 70%, #31406b); }
  #chars .char { position: absolute; bottom: 0; height: 92%; transform: translateX(-50%); transition: left 400ms ease, opacity 300ms ease, filter 200ms; }
  #chars .char img { height: 100%; width: auto; display: block; filter: drop-shadow(0 6px 18px rgba(0,0,0,.45)); }
  #chars .char.dim { filter: brightness(.72); }
  .char-ph { height: 100%; aspect-ratio: 2 / 3; border-radius: 45% 45% 8% 8%; background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.05));
             border: 1px solid var(--panel-edge); display: grid; place-items: center; text-align: center; font: 600 1.6cqw var(--ui); color: var(--ink); }
  #cg { opacity: 0; transition: opacity 600ms ease; pointer-events: none; }
  #cg.on { opacity: 1; }
  #cg img, #cg .ph { width: 100%; height: 100%; object-fit: cover; }
  #cg .ph { display: grid; place-items: center; padding: 8cqw; text-align: center; background: radial-gradient(circle at 50% 40%, #3a3150, #0d0b14); font-size: 2cqw; color: var(--ink-dim); }
  #box { position: absolute; left: 4%; right: 4%; bottom: 3.5%; height: 27%; padding: 3.2cqw 4cqw 2cqw;
         background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 1.2cqw; box-shadow: var(--shadow);
         background-size: 100% 100%; backdrop-filter: blur(6px); }
  #box.skin { background-color: transparent; border: none; backdrop-filter: none; }
  #name { position: absolute; top: -1.8cqw; left: 3cqw; padding: .5cqw 1.6cqw; border-radius: .8cqw; font: 700 1.55cqw var(--ui);
          background: var(--accent); color: var(--accent-ink); letter-spacing: .02em; box-shadow: var(--shadow); }
  #name:empty { display: none; }
  #text { font-size: 2.05cqw; line-height: 1.45; text-wrap: pretty; }
  #text.narration { font-style: italic; color: #e9e2d4; }
  #more { position: absolute; right: 2.4cqw; bottom: 1.6cqw; font: 1.4cqw var(--ui); opacity: 0; animation: bob 1s infinite; }
  #more.on { opacity: .8; }
  @keyframes bob { 50% { transform: translateY(.35cqw); } }
  #choices { display: none; place-content: center; gap: 1.4cqw; background: rgba(0,0,0,.35); }
  #choices.on { display: grid; }
  .choice { width: 56cqw; padding: 1.5cqw 3cqw; font: 600 1.8cqw var(--font); color: var(--ink); background: var(--panel);
            border: 1px solid var(--panel-edge); border-radius: 1cqw; cursor: pointer; background-size: 100% 100%; box-shadow: var(--shadow); }
  .choice.skin { background-color: transparent; border: none; }
  .choice:hover, .choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .choice .n { opacity: .55; margin-right: 1cqw; font-family: var(--ui); }
  .screen { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1.6cqw; text-align: center;
            background-size: cover; background-position: center; cursor: default; }
  .screen.on { display: flex; }
  .screen::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.7)); }
  .screen > * { position: relative; }
  .screen h1 { margin: 0 0 1cqw; font-size: 5.4cqw; letter-spacing: .02em; text-shadow: 0 4px 30px rgba(0,0,0,.6); }
  .screen p { margin: 0; max-width: 60cqw; font-size: 1.8cqw; color: var(--ink-dim); }
  .btn { min-width: 22cqw; padding: 1cqw 2.4cqw; font: 600 1.6cqw var(--ui); border-radius: 99px; border: 1px solid var(--panel-edge);
         background: var(--panel); color: var(--ink); cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  #menu { position: absolute; top: 1.4cqw; right: 1.4cqw; display: flex; gap: .6cqw; z-index: 5; }
  #menu[hidden] { display: none; }
  #menu button { font: 600 1.1cqw var(--ui); padding: .5cqw 1.1cqw; border-radius: 99px; border: 1px solid var(--panel-edge);
                 background: rgba(0,0,0,.45); color: var(--ink); cursor: pointer; }
  #toast { position: absolute; top: 1.4cqw; left: 50%; transform: translateX(-50%); padding: .6cqw 1.6cqw; border-radius: 99px;
           background: rgba(0,0,0,.7); font: 600 1.2cqw var(--ui); opacity: 0; transition: opacity 250ms; pointer-events: none; z-index: 6; }
  #toast.on { opacity: 1; }
  .kind { font: 700 1.2cqw var(--ui); letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
</style>
</head>
<body>
<div id="stage" aria-live="polite">
  <div class="layer" id="bgs"></div>
  <div class="layer" id="chars"></div>
  <div class="layer" id="cg"></div>
  <div id="box"><div id="name"></div><div id="text"></div><div id="more">▼</div></div>
  <div class="layer" id="choices" role="group" aria-label="Choices"></div>
  <div id="menu" hidden>
    <button id="m-save" type="button">Save</button><button id="m-load" type="button">Load</button>
    <button id="m-mute" type="button">Mute</button><button id="m-title" type="button">Title</button>
  </div>
  <div id="toast"></div>
  <div class="layer screen" id="title"><h1 id="t-title"></h1><p id="t-logline"></p>
    <button class="btn primary" id="t-start" type="button">Start</button><button class="btn" id="t-continue" type="button">Continue</button></div>
  <div class="layer screen" id="ending"><div class="kind" id="e-kind"></div><h1 id="e-title"></h1><p id="e-summary"></p>
    <button class="btn primary" id="e-again" type="button">Back to title</button></div>
</div>
<script src="story.js"></script>
<script>
(() => {
  "use strict";
  const DATA = window.STORY;
  const S = DATA.script, A = DATA.assets || {}, slug = S.slug;
  const $ = (id) => document.getElementById(id);
  const key = (...parts) => ["vn", slug, ...parts].join("/");
  const asset = (...parts) => A[key(...parts)] || null;
  const scenes = Object.fromEntries(S.scenes.map((s) => [s.id, s]));
  const chars = Object.fromEntries(S.characters.map((c) => [c.id, c]));
  const locs = Object.fromEntries(S.locations.map((l) => [l.id, l]));
  const endings = Object.fromEntries(S.endings.map((e) => [e.id, e]));
  const SAVE = `vn-${slug}-save`;
  const store = { get() { try { return JSON.parse(localStorage.getItem(SAVE) || "null"); } catch { return null; } },
                  set(v) { try { localStorage.setItem(SAVE, JSON.stringify(v)); return true; } catch { return false; } } };
  document.title = S.title;

  // ---------------------------------------------------------------- audio
  const probe = document.createElement("audio");
  const canOgg = !!probe.canPlayType && probe.canPlayType('audio/ogg; codecs="vorbis"') !== "";
  const pick = (a) => a && a.audio ? (a.audio.find((p) => canOgg ? p.endsWith(".ogg") : p.endsWith(".m4a")) || a.audio[0]) : null;
  let muted = false;
  const channels = { music: { el: null, src: null, vol: 0.55 }, amb: { el: null, src: null, vol: 0.4 } };
  function fade(el, to, ms, done) {
    const from = el.volume, start = performance.now();
    const tick = (now) => { const k = Math.min(1, (now - start) / ms); el.volume = from + (to - from) * k;
      if (k < 1) requestAnimationFrame(tick); else if (done) done(); };
    requestAnimationFrame(tick);
  }
  function loop(name, a) {
    const ch = channels[name], src = pick(a);
    if (ch.src === src) return;
    if (ch.el) { const old = ch.el; fade(old, 0, 600, () => old.pause()); }
    ch.src = src; ch.el = null;
    if (!src) return;
    const el = new Audio(src); el.loop = true; el.volume = 0; el.muted = muted;
    el.play().then(() => fade(el, ch.vol, 900)).catch(() => {});
    ch.el = el;
  }
  function sfx(a) { const src = pick(a); if (!src || muted) return; const el = new Audio(src); el.volume = 0.8; el.play().catch(() => {}); }

  // ---------------------------------------------------------------- visuals
  let bgFront = null;
  function setBackground(scene) {
    const loc = locs[scene.location] || { name: scene.location, times: [scene.time] };
    const a = asset("bg", scene.location, scene.time) || asset("bg", scene.location, (loc.times || [])[0] || "day");
    const id = `${scene.location}/${scene.time}`;
    if (bgFront && bgFront.dataset.id === id) return;
    let el;
    if (a && a.image) { el = new Image(); el.src = a.image; el.alt = ""; }
    else { el = document.createElement("div"); el.className = `placeholder-bg t-${scene.time}`; el.textContent = loc.name; }
    el.classList.add("bg"); el.dataset.id = id;
    $("bgs").appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("on")));
    const old = bgFront; bgFront = el;
    if (old) setTimeout(() => old.remove(), 800);
  }
  const SLOT = { left: 24, center: 50, right: 76 };
  function charEl(id, expr) {
    const c = chars[id] || { name: id }, a = asset("char", id, expr) || asset("char", id, "neutral");
    if (a && a.image) { const img = new Image(); img.src = a.image; img.alt = `${c.name} (${expr})`; return img; }
    const ph = document.createElement("div"); ph.className = "char-ph"; ph.innerHTML = `${c.name}<br><small>${expr}</small>`; return ph;
  }
  function renderChars(speaker) {
    const layer = $("chars"); layer.innerHTML = "";
    for (const [id, st] of Object.entries(state.shown)) {
      const wrap = document.createElement("div"); wrap.className = "char"; wrap.style.left = `${SLOT[st.pos] || 50}%`;
      if (speaker && speaker !== id) wrap.classList.add("dim");
      wrap.appendChild(charEl(id, st.expr)); layer.appendChild(wrap);
    }
  }
  function freeSlot() {
    const used = new Set(Object.values(state.shown).map((s) => s.pos));
    return ["center", "left", "right"].find((p) => !used.has(p)) || "center";
  }
  function setCg(id, text) {
    const layer = $("cg"); layer.innerHTML = "";
    if (!id) { layer.classList.remove("on"); return; }
    const a = asset("cg", id);
    if (a && a.image) { const img = new Image(); img.src = a.image; img.alt = text || id; layer.appendChild(img); }
    else { const ph = document.createElement("div"); ph.className = "ph"; ph.textContent = text || id; layer.appendChild(ph); }
    layer.classList.add("on");
  }
  function skin() {
    const box = asset("ui", "textbox"), title = asset("ui", "title");
    if (box && box.image) { $("box").style.backgroundImage = `url("${box.image}")`; $("box").classList.add("skin"); }
    if (title && title.image) { $("title").style.backgroundImage = `url("${title.image}")`; }
    else { $("title").style.background = "radial-gradient(circle at 50% 35%, #3b2f55, #09070e)"; }
  }

  // ---------------------------------------------------------------- engine
  let state = null, typing = null, waiting = null;
  const fresh = () => ({ scene: S.start, index: 0, vars: Object.fromEntries((S.variables || []).map((v) => [v.name, v.initial || 0])), shown: {}, cg: null });
  function test(cond) {
    if (!cond) return true;
    const v = state.vars[cond.var] || 0, x = cond.value;
    return { "==": v === x, "!=": v !== x, ">=": v >= x, "<=": v <= x, ">": v > x, "<": v < x }[cond.op] ?? true;
  }
  function apply(assigns) { for (const a of assigns || []) state.vars[a.var] = a.op === "set" ? a.value : (state.vars[a.var] || 0) + a.value; }
  function enter(sceneId, keepIndex) {
    const scene = scenes[sceneId];
    if (!scene) { console.error("unknown scene", sceneId); return; }
    state.scene = sceneId;
    if (!keepIndex) { state.index = 0; state.shown = {}; state.cg = null; }
    setBackground(scene); setCg(state.cg && state.cg.id, state.cg && state.cg.text);
    loop("music", asset("music", scene.music)); loop("amb", asset("amb", scene.location));
    renderChars(null); run();
  }
  function run() {
    const scene = scenes[state.scene];
    while (state.index < scene.nodes.length) {
      const n = scene.nodes[state.index];
      switch (n.kind) {
        case "show": if (state.cg) { state.cg = null; setCg(null); }  // staging characters ends the CG
                     state.shown[n.character] = { expr: n.expression || (state.shown[n.character] || {}).expr || "neutral",
                                                  pos: n.position || (state.shown[n.character] || {}).pos || freeSlot() }; renderChars(null); break;
        case "hide": if (state.cg) { state.cg = null; setCg(null); }
                     delete state.shown[n.character]; renderChars(null); break;
        case "sfx": sfx(asset("sfx", n.cue)); break;
        case "cg": state.cg = { id: n.cg, text: n.text }; setCg(n.cg, n.text); break;
        case "set": apply(n.assign); break;
        case "say": case "narrate": return say(n);
        case "choice": return choose(n);
        case "jump": return enter(n.goto);
        case "ending": return end(n.ending);
      }
      state.index++;
    }
  }
  function say(n) {
    const who = n.kind === "say" ? n.speaker : null;
    if (who && chars[who]) {
      const st = state.shown[who];
      state.shown[who] = { expr: n.expression || (st ? st.expr : "neutral"), pos: n.position || (st ? st.pos : freeSlot()) };
    }
    renderChars(who);
    $("name").textContent = who ? (chars[who] ? chars[who].name : who) : "";
    const box = $("text"); box.className = who ? "" : "narration"; box.textContent = "";
    $("more").classList.remove("on");
    const full = n.text || ""; let i = 0;
    clearInterval(typing);
    typing = setInterval(() => { i += 2; box.textContent = full.slice(0, i); if (i >= full.length) finishTyping(); }, 24);
    box.dataset.full = full; waiting = "line";
  }
  function finishTyping() { clearInterval(typing); typing = null; $("text").textContent = $("text").dataset.full || ""; $("more").classList.add("on"); }
  function choose(n) {
    waiting = "choice";
    const layer = $("choices"); layer.innerHTML = "";
    const options = n.choices.filter((c) => test(c.require));
    const choiceSkin = asset("ui", "choice");
    options.forEach((c, i) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "choice";
      if (choiceSkin && choiceSkin.image) { b.style.backgroundImage = `url("${choiceSkin.image}")`; b.classList.add("skin"); }
      b.innerHTML = `<span class="n">${i + 1}</span>`; b.append(c.text);
      b.addEventListener("click", (ev) => { ev.stopPropagation(); pickChoice(c); });
      layer.appendChild(b);
    });
    layer.classList.add("on");
    const first = layer.querySelector("button"); if (first) first.focus({ preventScroll: true });
  }
  function pickChoice(c) { $("choices").classList.remove("on"); waiting = null; apply(c.set); enter(c.goto); }
  function end(id) {
    waiting = "ending"; const e = endings[id] || { title: id, summary: "", kind: "" };
    $("e-kind").textContent = e.kind ? `${e.kind} ending` : "The end"; $("e-title").textContent = e.title; $("e-summary").textContent = e.summary || "";
    $("ending").classList.add("on"); $("menu").hidden = true;
  }
  function advance() {
    if (waiting !== "line") return;
    if (typing) { finishTyping(); return; }
    waiting = null; state.index++; run();
  }

  // ---------------------------------------------------------------- screens + input
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1400); }
  function showTitle() {
    for (const ch of Object.values(channels)) { if (ch.el) ch.el.pause(); ch.el = null; ch.src = null; }
    $("ending").classList.remove("on"); $("choices").classList.remove("on"); $("title").classList.add("on"); $("menu").hidden = true;
    $("t-continue").disabled = !store.get(); waiting = null;
  }
  function start(saved) {
    $("title").classList.remove("on"); $("menu").hidden = false;
    state = saved ? JSON.parse(JSON.stringify(saved)) : fresh();
    enter(state.scene, !!saved);
  }
  $("t-title").textContent = S.title;
  $("t-logline").textContent = DATA.logline || "";
  $("t-start").addEventListener("click", (e) => { e.stopPropagation(); start(null); });
  $("t-continue").addEventListener("click", (e) => { e.stopPropagation(); const s = store.get(); if (s) start(s.state); });
  $("e-again").addEventListener("click", (e) => { e.stopPropagation(); showTitle(); });
  $("m-save").addEventListener("click", (e) => { e.stopPropagation(); toast(store.set({ state, at: Date.now() }) ? "Saved" : "Can't save here"); });
  $("m-load").addEventListener("click", (e) => { e.stopPropagation(); const s = store.get(); if (s) { $("choices").classList.remove("on"); start(s.state); toast("Loaded"); } else toast("No save yet"); });
  $("m-mute").addEventListener("click", (e) => { e.stopPropagation(); muted = !muted; for (const ch of Object.values(channels)) if (ch.el) ch.el.muted = muted; $("m-mute").textContent = muted ? "Unmute" : "Mute"; });
  $("m-title").addEventListener("click", (e) => { e.stopPropagation(); showTitle(); });
  $("stage").addEventListener("click", advance);
  document.addEventListener("keydown", (e) => {
    if (e.key === " " || e.key === "Enter") { if (waiting === "line") { e.preventDefault(); advance(); } }
    else if (waiting === "choice" && /^[1-9]$/.test(e.key)) { const b = $("choices").querySelectorAll("button")[+e.key - 1]; if (b) b.click(); }
  });
  skin(); showTitle();
  // Small hook for automated play-throughs (and the curious): window.vn.state(), .advance(), .choose(i)
  window.vn = { state: () => state && { ...state, waiting }, advance, choose: (i) => $("choices").querySelectorAll("button")[i]?.click(),
                start: () => start(null), missing: DATA.missing || [] };
})();
</script>
</body>
</html>
